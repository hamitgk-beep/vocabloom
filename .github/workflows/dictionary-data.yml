name: dictionary-data
# Builds the inputs of the built-in Turkish library (release assets, used by
# tools/build_dict.py). Users of the app never need an API key: the AI work
# happens here, once, and the results are shipped inside the app.
on:
  workflow_dispatch:
    inputs:
      job:
        description: "tatoeba or translate"
        default: translate
      provider:
        description: "all, or one of gemini, mistral, groq, cerebras, github, nvidia, openrouter"
        default: all
      model:
        description: "model name (empty = default)"
        default: ""
      limit:
        description: "max expressions this run"
        default: "100000"
  schedule:
    - cron: "17 3 * * *"   # once a day
    # GitHub sometimes skips a scheduled run; a second one later in the day picks up what is left
    # (finished work is skipped, and a used-up quota ends it quickly). Gemini's day starts at 08:00 UTC.
    - cron: "37 8 * * *"

concurrency:
  # A run for one service can start while another service is still working.
  group: dictionary-data-${{ inputs.provider || 'all' }}
  cancel-in-progress: false

jobs:
  tatoeba:
    if: github.event_name == 'workflow_dispatch' && inputs.job == 'tatoeba'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download Tatoeba and extract English-Turkish pairs
        run: |
          set -e
          mkdir -p t && cd t
          curl -sSfLO https://downloads.tatoeba.org/exports/per_language/eng/eng_sentences.tsv.bz2
          curl -sSfLO https://downloads.tatoeba.org/exports/per_language/tur/tur_sentences.tsv.bz2
          curl -sSfLO https://downloads.tatoeba.org/exports/links.tar.bz2
          bunzip2 -f eng_sentences.tsv.bz2 tur_sentences.tsv.bz2
          tar xjf links.tar.bz2
          python3 ../tools/tatoeba_extract.py eng_sentences.tsv tur_sentences.tsv links.csv ../tatoeba_en_tr.tsv.gz
          ls -la ../tatoeba_en_tr.tsv.gz
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view data-tatoeba >/dev/null 2>&1 || gh release create data-tatoeba --prerelease \
            --target "$GITHUB_SHA" --title "Tatoeba data (build input)" \
            --notes "English-Turkish sentence pairs from Tatoeba (CC BY 2.0 FR). Used by tools/build_dict.py."
          gh release upload data-tatoeba tatoeba_en_tr.tsv.gz --clobber

  translate:
    if: github.event_name == 'schedule' || inputs.job == 'translate'
    runs-on: ubuntu-latest
    timeout-minutes: 340
    permissions:
      contents: write
      models: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Each free service takes its own share first, so they do not repeat each other.
          - { service: gemini,     shard: "0/7" }
          - { service: mistral,    shard: "1/7" }
          - { service: groq,       shard: "2/7" }
          - { service: cerebras,   shard: "3/7" }
          - { service: github,     shard: "4/7" }
          - { service: nvidia,     shard: "5/7" }
          - { service: openrouter, shard: "6/7" }
    steps:
      - uses: actions/checkout@v4
      - name: Get earlier results of all services
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view data-exd >/dev/null 2>&1 || gh release create data-exd --prerelease \
            --target "$GITHUB_SHA" --title "Built-in Turkish library (build input)" \
            --notes "Senses, Turkish explanations and translated examples of every expression, and word families. Made once with AI at build time; used by tools/build_dict.py." || true
          mkdir -p prev
          gh release download data-exd -D prev -p 'exd*' -p 'wfd*' -p 'syn*' -p 'wd-*' -p 'gl-*' -p 'rv-*' || true
          ls -la prev
      - name: Translate
        if: inputs.provider == '' || inputs.provider == 'all' || inputs.provider == matrix.service
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          MODEL: ${{ inputs.provider == matrix.service && inputs.model || '' }}
          LIMIT: ${{ inputs.limit || '100000' }}
        run: |
          S=${{ matrix.service }}
          cp prev/exd-$S.jsonl.gz . 2>/dev/null || true
          cp prev/wfd-$S.jsonl.gz . 2>/dev/null || true
          cp prev/syn-$S.jsonl.gz . 2>/dev/null || true
          cp prev/wd-$S.jsonl.gz . 2>/dev/null || true
          cp prev/gl-$S.jsonl.gz . 2>/dev/null || true
          cp prev/rv-$S.jsonl.gz . 2>/dev/null || true
          python3 tools/pretranslate.py assets/dict.db exd-$S.jsonl.gz --provider $S --model "$MODEL" \
            --limit "$LIMIT" --minutes 320 --families wfd-$S.jsonl.gz --review rv-$S.jsonl.gz --gloss gl-$S.jsonl.gz --words wd-$S.jsonl.gz --senses syn-$S.jsonl.gz --shard ${{ matrix.shard }} \
            --done prev/*.jsonl.gz
      - name: Save results
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          S=${{ matrix.service }}
          for f in exd-$S.jsonl.gz wfd-$S.jsonl.gz wd-$S.jsonl.gz syn-$S.jsonl.gz gl-$S.jsonl.gz rv-$S.jsonl.gz; do
            if [ -f $f ]; then
              gh release upload data-exd $f --clobber
              python3 -c "import gzip,sys;print(sys.argv[1], sum(1 for _ in gzip.open(sys.argv[1],'rt')))" $f
            fi
          done

  # After the translations: rebuild the app dictionary with everything finished
  # so far and, when there is something new, commit it and start an app build,
  # so users get an update with the new entries every day.
  publish:
    needs: translate
    if: always() && (github.event_name == 'schedule' || inputs.job == 'translate')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - name: Get sources and all results
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -e
          mkdir -p raw && cd raw
          curl -sSfLO https://raw.githubusercontent.com/freedict/fd-dictionaries/master/eng-tur/eng-tur.tei
          curl -sSfLO https://raw.githubusercontent.com/StarlangSoftware/TurkishWordNet/master/kenet.xml
          curl -sSfLO https://raw.githubusercontent.com/globalwordnet/cili/master/ili-map-pwn30.tab
          curl -sSfL -o wn30.zip https://raw.githubusercontent.com/nltk/nltk_data/gh-pages/packages/corpora/wordnet.zip
          unzip -q wn30.zip
          gh release download data-tatoeba -p 'tatoeba_en_tr.tsv.gz'
          gh release download data-wiktionary -p 'wiktionary_phrases.json.gz'
          gh release download data-exd -p 'exd*' -p 'wfd*' -p 'syn*' -p 'wd-*' -p 'gl-*' -p 'rv-*'
          ls -la
      - name: Rebuild the dictionary
        run: |
          cp assets/dict.db old.db
          REVIEW_KEEP_FROM=old.db python3 tools/build_dict.py raw assets/dict.db
      - name: Publish when there are new entries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY' > stats.txt
          import sqlite3
          def stats(path):
              db = sqlite3.connect(path)
              out = {}
              for name, q in [('expressions', 'SELECT count(*) FROM exd'), ('words', 'SELECT count(*) FROM wd'),
                              ('families', 'SELECT count(*) FROM wfd'),
                              ('Turkish meanings', "SELECT count(*) FROM expr WHERE tr IS NOT NULL AND tr != ''"),
                              ('senses', "SELECT count(*) FROM syn WHERE tr IS NOT NULL AND tr != '[]'")]:
                  try:
                      out[name] = db.execute(q).fetchone()[0]
                  except sqlite3.OperationalError:
                      out[name] = 0
              return out
          old, new = stats('old.db'), stats('assets/dict.db')
          grew = {k: new[k] - old[k] for k in new if new[k] > old[k]}
          print('NEW=' + ('1' if grew else '0'))
          print('MSG=' + ', '.join(f'{v} new {k}' for k, v in grew.items()))
          print('TOTAL=' + ', '.join(f'{k} {v}' for k, v in new.items()))
          PY
          cat stats.txt
          NEW=$(sed -n 's/^NEW=//p' stats.txt); MSG=$(sed -n 's/^MSG=//p' stats.txt); TOTAL=$(sed -n 's/^TOTAL=//p' stats.txt)
          if [ "$NEW" != "1" ]; then echo "nothing new"; exit 0; fi
          # devices copy the bundled dictionary again when this number changes
          python3 - <<'PY'
          import re
          p = 'lib/data/dict_db.dart'
          s = open(p).read()
          s = re.sub(r"_version = '(\d+)'", lambda m: f"_version = '{int(m.group(1)) + 1}'", s, count=1)
          open(p, 'w').write(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/dict.db lib/data/dict_db.dart
          git commit -m "Dictionary: $MSG" -m "Built-in library now: $TOTAL"
          git pull --rebase origin main
          git push origin HEAD:main
          # a push made with the workflow token does not start other workflows, so start the app build
          gh workflow run build.yml --ref main
