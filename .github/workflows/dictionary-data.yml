name: dictionary-data
# Builds the inputs of the built-in Turkish library (release assets, used by
# tools/build_dict.py). Users of the app never need an API key: the AI work
# happens here, once, and the results are shipped inside the app.
on:
  workflow_dispatch:
    inputs:
      job:
        description: "tatoeba or translate"
        default: translate
      provider:
        description: "all, or one of gemini, mistral, groq, cerebras, github, nvidia, openrouter"
        default: all
      model:
        description: "model name (empty = default)"
        default: ""
      limit:
        description: "max expressions this run"
        default: "100000"
  schedule:
    - cron: "17 3 * * *"   # once a day, when the free quota is fresh

concurrency:
  # A run for one service can start while another service is still working.
  group: dictionary-data-${{ inputs.provider || 'all' }}
  cancel-in-progress: false

jobs:
  tatoeba:
    if: github.event_name == 'workflow_dispatch' && inputs.job == 'tatoeba'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download Tatoeba and extract English-Turkish pairs
        run: |
          set -e
          mkdir -p t && cd t
          curl -sSfLO https://downloads.tatoeba.org/exports/per_language/eng/eng_sentences.tsv.bz2
          curl -sSfLO https://downloads.tatoeba.org/exports/per_language/tur/tur_sentences.tsv.bz2
          curl -sSfLO https://downloads.tatoeba.org/exports/links.tar.bz2
          bunzip2 -f eng_sentences.tsv.bz2 tur_sentences.tsv.bz2
          tar xjf links.tar.bz2
          python3 ../tools/tatoeba_extract.py eng_sentences.tsv tur_sentences.tsv links.csv ../tatoeba_en_tr.tsv.gz
          ls -la ../tatoeba_en_tr.tsv.gz
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view data-tatoeba >/dev/null 2>&1 || gh release create data-tatoeba --prerelease \
            --target "$GITHUB_SHA" --title "Tatoeba data (build input)" \
            --notes "English-Turkish sentence pairs from Tatoeba (CC BY 2.0 FR). Used by tools/build_dict.py."
          gh release upload data-tatoeba tatoeba_en_tr.tsv.gz --clobber

  translate:
    if: github.event_name == 'schedule' || inputs.job == 'translate'
    runs-on: ubuntu-latest
    timeout-minutes: 340
    permissions:
      contents: write
      models: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Each free service takes its own share first, so they do not repeat each other.
          - { service: gemini,     shard: "0/7" }
          - { service: mistral,    shard: "1/7" }
          - { service: groq,       shard: "2/7" }
          - { service: cerebras,   shard: "3/7" }
          - { service: github,     shard: "4/7" }
          - { service: nvidia,     shard: "5/7" }
          - { service: openrouter, shard: "6/7" }
    steps:
      - uses: actions/checkout@v4
      - name: Get earlier results of all services
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view data-exd >/dev/null 2>&1 || gh release create data-exd --prerelease \
            --target "$GITHUB_SHA" --title "Built-in Turkish library (build input)" \
            --notes "Senses, Turkish explanations and translated examples of every expression, and word families. Made once with AI at build time; used by tools/build_dict.py." || true
          mkdir -p prev
          gh release download data-exd -D prev -p 'exd*' -p 'wfd*' || true
          ls -la prev
      - name: Translate
        if: inputs.provider == '' || inputs.provider == 'all' || inputs.provider == matrix.service
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          MODEL: ${{ inputs.provider == matrix.service && inputs.model || '' }}
          LIMIT: ${{ inputs.limit || '100000' }}
        run: |
          S=${{ matrix.service }}
          cp prev/exd-$S.jsonl.gz . 2>/dev/null || true
          cp prev/wfd-$S.jsonl.gz . 2>/dev/null || true
          python3 tools/pretranslate.py assets/dict.db exd-$S.jsonl.gz --provider $S --model "$MODEL" \
            --limit "$LIMIT" --minutes 320 --families wfd-$S.jsonl.gz --shard ${{ matrix.shard }} \
            --done prev/*.jsonl.gz
      - name: Save results
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          S=${{ matrix.service }}
          for f in exd-$S.jsonl.gz wfd-$S.jsonl.gz; do
            if [ -f $f ]; then
              gh release upload data-exd $f --clobber
              python3 -c "import gzip,sys;print(sys.argv[1], sum(1 for _ in gzip.open(sys.argv[1],'rt')))" $f
            fi
          done
