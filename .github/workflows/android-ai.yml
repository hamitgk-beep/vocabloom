name: android-ai
# Runs the offline AI inside an Android emulator: download, llama.cpp load and
# an answer, the same code path as on a phone. Answers and errors are in the log.
on:
  pull_request:
    paths: ['integration_test/**', '.github/workflows/android-ai.yml', 'lib/ai/local_engine.dart']
  workflow_dispatch:

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk/2[0-5]* /opt/ghc /usr/local/.ghcup || true
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, flutter-version: 3.50.0 }
      - run: flutter pub get
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          ram-size: 8192M
          heap-size: 1024M
          disk-size: 14G
          cores: 4
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: flutter test integration_test/ai_android_test.dart -d emulator-5554 --reporter expanded 2>&1 | tee test.log; grep -q "All tests passed" test.log
      - name: AI lines from the log
        if: always()
        run: grep -E "AI |Error|Exception" test.log | head -200 || true
