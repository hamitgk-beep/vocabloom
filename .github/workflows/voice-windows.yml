name: voice-windows
# Downloads the voice packs and speaks with them on Windows, as the app does.
on:
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths: ['lib/tts/**', 'test/speech_test.dart', 'test/os_download_test.dart', '.github/workflows/voice-windows.yml']
jobs:
  voice:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, flutter-version: 3.50.0 }
      - run: flutter pub get
      - name: Download and speak
        shell: bash
        run: |
          lib=$(find "$LOCALAPPDATA/Pub/Cache/hosted/pub.dev" -path '*sherpa_onnx_windows-*/windows' -type d | head -1)
          echo "libs: $lib"; ls "$lib" | head -30
          # Windows has its own older onnxruntime.dll in System32, which is
          # found before PATH; the app avoids it by shipping the DLLs next to
          # its exe, so do the same for the test runner.
          tester=$(dirname "$(find "$FLUTTER_ROOT/bin/cache/artifacts/engine" -name flutter_tester.exe | head -1)")
          cp "$lib"/*.dll "$tester"/
          export SHERPA_ONNX_LIB_DIR="$(cygpath -w "$lib")" PATH="$lib:$PATH"
          export VOCABLOOM_VOICE_BASE=https://github.com/${{ github.repository }}/releases/download/voice-models
          flutter test test/speech_test.dart --reporter expanded
      - name: Windows' own downloaders (for PCs where Dart's client is blocked)
        shell: bash
        run: |
          VOCABLOOM_OS_DOWNLOAD=curl flutter test test/os_download_test.dart --reporter expanded
          VOCABLOOM_OS_DOWNLOAD=powershell flutter test test/os_download_test.dart --reporter expanded
