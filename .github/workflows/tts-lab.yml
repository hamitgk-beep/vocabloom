name: tts-lab
# Temporary: Turkish voice comparison on an ARM CPU. Removed before merge.
on:
  push:
    branches-ignore: [main]
    paths: [tools/tts_lab/**, .github/workflows/tts-lab.yml]
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install --extra-index-url https://download.pytorch.org/whl/cpu torch ema-lightning onnx onnxruntime huggingface_hub
      - run: python -u tools/tts_lab/ema_export.py ema-onnx 2>&1 | grep -v -E '^ +%|aten::|onnx::' ; exit ${PIPESTATUS[0]}
      - name: Publish to the 'voice-lab' release (scratch, not used by the app)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd ema-onnx && zip -q ../ema-onnx.zip * && cd ..
          gh release view voice-lab >/dev/null 2>&1 || gh release create voice-lab --prerelease --title "voice lab (scratch)" --notes "Temporary files for voice experiments."
          gh release upload voice-lab ema-onnx.zip --clobber
  lab:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install --extra-index-url https://download.pytorch.org/whl/cpu torch ema-lightning sherpa-onnx==1.13.8 faster-whisper soundfile scipy huggingface_hub torchaudio
      - name: Piper Turkish models
        run: |
          mkdir -p models && cd models
          for v in fahrettin fettah dfki; do curl -sSfL https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-tr_TR-$v-medium.tar.bz2 | tar xj || echo "no $v"; done
      - name: trnorm (Ahenk's Turkish text normaliser)
        run: |
          git clone --depth 1 https://github.com/ozguradmin/ahenk-turkish-tts ahenk
          find ahenk -maxdepth 4 -name "trnorm*" | head
          d=$(dirname "$(find ahenk -maxdepth 4 -type d -name trnorm | head -1)")
          echo "PYTHONPATH=$PWD/$d" >> "$GITHUB_ENV"
      - run: mkdir -p out && ulimit -v 12000000 && OUT=out python -u tools/tts_lab/tr_lab.py 2>&1 | grep -v -E "Warning|warn\(" | tee out/log.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: tr-samples, path: out}
