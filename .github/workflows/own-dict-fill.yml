name: own-dict-fill
# Second pass: translates only the headwords that the full run did not return.
# Started by pushing the marker file tools/own_dict/START_FILL to the branch.
on:
  push:
    branches: [claude/project-thread-qj1ytv]
    paths: [tools/own_dict/START_FILL]
  workflow_dispatch:

jobs:
  fill:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install anthropic
      - name: Generate missing items
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then echo "ANTHROPIC_API_KEY secret is missing"; exit 1; fi
          cd tools/own_dict
          python3 generate_full.py fill_items.json fill_out --model claude-haiku-5-5 --workers 4
          gzip -9 -f fill_out/results.jsonl
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/own_dict/fill_out
          git commit -m "Own dictionary: fill run results (gzipped) [skip ci]" || exit 0
          git push
