name: voice-perf
# Speed and quality gate for the offline voices, on an ARM CPU, with the voice
# packs users download. A Whisper model writes down what each voice said, so a
# skipped, repeated or cut-off word fails it. Two phones are simulated:
#   weak phone:     1 thread, times x3, light voice
#   ordinary phone: 4 threads, times x1.5, natural voice
# build.yml runs it before every release; it also runs when voice code changes.
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths: [lib/tts/**, test/voice_perf_test.dart, .github/workflows/voice-perf.yml]

jobs:
  voice:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      # No prebuilt Flutter for Linux ARM: the git checkout fetches the ARM Dart SDK itself.
      - name: Flutter 3.50.0 (ARM)
        run: |
          git clone --depth 1 --branch 3.50.0 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter --version && flutter pub get
      - name: Speech recognizer for the checks (Whisper base)
        run: |
          mkdir -p "$RUNNER_TEMP/asr" && cd "$RUNNER_TEMP/asr"
          curl -sSfL https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-whisper-base.tar.bz2 | tar xj
      - name: Weak phone (1 thread, light voice)
        run: |
          lib=$(find ~/.pub-cache/hosted/pub.dev -path '*sherpa_onnx_linux-*/linux/aarch64' -type d | head -1)
          SHERPA_ONNX_LIB_DIR=$lib LD_LIBRARY_PATH=$lib VOCABLOOM_TTS_THREADS=1 VOCABLOOM_VOICE_PROFILE=low \
          VOCABLOOM_ASR_DIR=$RUNNER_TEMP/asr/sherpa-onnx-whisper-base \
          VOCABLOOM_VOICE_BASE=https://github.com/${{ github.repository }}/releases/download/voice-models \
          flutter test test/voice_perf_test.dart || st=$?
          cat voice-perf-report.txt >> report.txt || true
          exit ${st:-0}
      - name: Ordinary phone (4 threads, natural voice)
        if: always()
        run: |
          lib=$(find ~/.pub-cache/hosted/pub.dev -path '*sherpa_onnx_linux-*/linux/aarch64' -type d | head -1)
          SHERPA_ONNX_LIB_DIR=$lib LD_LIBRARY_PATH=$lib VOCABLOOM_TTS_THREADS=4 VOCABLOOM_VOICE_PROFILE=mid \
          VOCABLOOM_ASR_DIR=$RUNNER_TEMP/asr/sherpa-onnx-whisper-base \
          VOCABLOOM_VOICE_BASE=https://github.com/${{ github.repository }}/releases/download/voice-models \
          flutter test test/voice_perf_test.dart || st=$?
          cat voice-perf-report.txt >> report.txt || true
          exit ${st:-0}
      - name: Report
        if: always()
        run: |
          [ -f report.txt ] && cat report.txt >> "$GITHUB_STEP_SUMMARY" || true
          [ -f report.txt ] && cat report.txt || true
