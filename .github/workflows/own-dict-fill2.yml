name: own-dict-fill2
# Free-tier fill of missing own-dictionary meanings (Gemini first, then Groq). Never touches the app DB or main.
# Started by pushing tools/own_dict/fill2/START to this branch. Resumable: finished keys are skipped.
on:
  push:
    branches: [claude/project-thread-qj1ytv]
    paths: [tools/own_dict/fill2/START]
  workflow_dispatch:
concurrency:
  group: own-dict-fill2
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  fill:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fill missing meanings (free tiers only)
        env:
          GEMINI_API_KEY_FOR_DICTIONARY: ${{ secrets.GEMINI_API_KEY_FOR_DICTIONARY }}
          GROQ_API_KEY_FOR_DICTIONARY: ${{ secrets.GROQ_API_KEY_FOR_DICTIONARY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          cd tools/own_dict/fill2
          mkdir -p out
          if [ -f out/results.jsonl.gz ]; then gunzip -kf out/results.jsonl.gz; fi
          touch out/results.jsonl
          gunzip -kf items.json.gz
          PROVIDERS=$(tr -d ' \n' < PROVIDERS)
          BUDGET=$(tr -d ' \n' < BUDGET_USD)
          python3 run_fill.py items.json out --batch 10 --max-requests 1000 --max-minutes 280 --providers "$PROVIDERS" --budget-usd "$BUDGET" || true
          cat out/summary.json || true
      - name: Save results and commit
        if: always()
        run: |
          cd tools/own_dict/fill2
          mkdir -p out
          if [ -f out/results.jsonl ]; then gzip -9 -f out/results.jsonl; fi
          rm -f items.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cd "$GITHUB_WORKSPACE"
          # Keep this run's output, then rebuild on the branch's latest state and merge (never overwrite).
          mkdir -p "$RUNNER_TEMP/run_out"
          cp tools/own_dict/fill2/out/* "$RUNNER_TEMP/run_out/" || true
          for i in 1 2 3 4 5; do
            git fetch -q origin "$GITHUB_REF_NAME"
            git reset -q --hard "origin/$GITHUB_REF_NAME"
            python3 tools/own_dict/fill2/merge_run.py "$RUNNER_TEMP/run_out" tools/own_dict/fill2/out || break
            git add -A tools/own_dict/fill2/out
            git commit -q -m "Own dictionary: free-tier fill run results [skip ci]" || break
            git push -q origin "HEAD:$GITHUB_REF_NAME" && break
            sleep $((i * 5))
          done
