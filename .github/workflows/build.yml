name: build
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, flutter-version: 3.50.0 }
      - run: flutter pub get
      - run: flutter test

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, flutter-version: 3.50.0 }
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: VocaBloom-Windows
          path: build/windows/x64/runner/Release

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, flutter-version: 3.50.0 }
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: VocaBloom-Android
          path: build/app/outputs/flutter-apk/app-release.apk

  ios:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, flutter-version: 3.50.0 }
      - run: flutter build ios --config-only --release --no-codesign
      - name: Raise CocoaPods platform for ML Kit
        run: |
          if [ -f ios/Podfile ]; then
            sed -i '' "s/^# *platform :ios.*/platform :ios, '15.5'/; s/^platform :ios.*/platform :ios, '15.5'/" ios/Podfile
            grep -q "^platform :ios" ios/Podfile || sed -i '' "1s/^/platform :ios, '15.5'\n/" ios/Podfile
          fi
      - run: flutter build ios --release --no-codesign
      - name: Package unsigned IPA (sign with Sideloadly / AltStore)
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr VocaBloom-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: VocaBloom-iOS
          path: VocaBloom-unsigned.ipa

  macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, flutter-version: 3.50.0 }
      - run: flutter build macos --release
      - uses: actions/upload-artifact@v4
        with:
          name: VocaBloom-macOS
          path: build/macos/Build/Products/Release/VocaBloom.app
