name: build
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
            out: build/windows/x64/runner/Release
          - os: ubuntu-latest
            target: apk
            out: build/app/outputs/flutter-apk
          - os: ubuntu-latest
            target: linux
            out: build/linux/x64/release/bundle
          - os: macos-latest
            target: macos
            out: build/macos/Build/Products/Release
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
      - if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev ninja-build clang cmake
      - if: matrix.target == 'apk'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: flutter pub get
      - run: flutter test
      - run: flutter build ${{ matrix.target }} --release
      - uses: actions/upload-artifact@v4
        with:
          name: kelime-okur-${{ matrix.target }}
          path: ${{ matrix.out }}
