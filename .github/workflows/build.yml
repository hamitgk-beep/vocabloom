name: build
# Tests and builds every platform. It never publishes anything: a push to
# main, a merged pull request or a manual start only builds and checks the
# release files (job "package"). The real release is release.yml, started by
# hand and approved in the "production" environment (docs/RELEASING.md).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only token for every job here, whatever the repository default is.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      # User-facing version: every merge to main after the base commit adds
      # 0.1 (1.1, 1.2 ... 1.9, 2.0 ...). The build number stays for update checks.
      - id: version
        run: |
          v=$(tools/release/version.sh HEAD)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Version $v"
      - uses: subosito/flutter-action@v2
        with: { channel: stable, flutter-version: 3.50.0 }
      - run: flutter pub get
      # PDFium for the import tests (the app bundles its own copy).
      - name: PDFium for tests
        run: |
          mkdir -p "$RUNNER_TEMP/pdfium"
          curl -sSfL https://github.com/bblanchon/pdfium-binaries/releases/download/chromium/8125/pdfium-linux-x64.tgz | tar xz -C "$RUNNER_TEMP/pdfium"
          echo "PDFIUM_PATH=$RUNNER_TEMP/pdfium/lib/libpdfium.so" >> "$GITHUB_ENV"
      - run: flutter test

  voice:
    needs: test
    uses: ./.github/workflows/voice-perf.yml

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, flutter-version: 3.50.0 }
      - name: Check Windows OCR
        run: flutter test test/ocr_platform_test.dart
      - run: flutter build windows --release --build-name=${{ needs.test.outputs.version }} --build-number=${{ github.run_number }} --dart-define=BUILD_NUMBER=${{ github.run_number }} --dart-define=APP_VERSION=${{ needs.test.outputs.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: Storilex-Windows
          path: build/windows/x64/runner/Release

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, flutter-version: 3.50.0 }
      - name: Release signing key
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KS" ]; then
            # Spaces or line breaks picked up while copying are removed.
            printf '%s' "$KS" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/vocabloom.jks"
            PW=$(printf '%s' "$PW" | tr -d '[:space:]')
            # If the whole README was pasted, keep only what follows the last colon.
            PW=${PW##*:}
            echo "::add-mask::$PW"
            echo "Keystore size: $(stat -c %s "$RUNNER_TEMP/vocabloom.jks") bytes (expected 2131), sha256 starts $(sha256sum "$RUNNER_TEMP/vocabloom.jks" | cut -c1-16) (expected 7feb829e563cea1b)"
            if ! keytool -list -keystore "$RUNNER_TEMP/vocabloom.jks" -storepass "$PW" >/dev/null 2>&1; then
              echo "Password length: ${#PW} (expected 32)"
              echo "::error::The signing key could not be opened. Check that ANDROID_KEYSTORE_B64 holds the whole text file and ANDROID_KEY_PASSWORD holds only the password."
              exit 1
            fi
            echo "VOCABLOOM_KEYSTORE=$RUNNER_TEMP/vocabloom.jks" >> "$GITHUB_ENV"
            echo "VOCABLOOM_KEY_PASSWORD=$PW" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_B64 secret is not set; the APK is signed with a temporary debug key."
          fi
      - run: flutter build apk --release --build-name=${{ needs.test.outputs.version }} --build-number=${{ github.run_number }} --dart-define=BUILD_NUMBER=${{ github.run_number }} --dart-define=APP_VERSION=${{ needs.test.outputs.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: Storilex-Android
          path: build/app/outputs/flutter-apk/app-release.apk

  linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # GTK for the window, GStreamer for audioplayers, a JDK for the jni plugin.
      - name: Linux build tools
        run: sudo apt-get update -q && sudo apt-get install -yq ninja-build libgtk-3-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, flutter-version: 3.50.0 }
      - run: flutter build linux --release --build-name=${{ needs.test.outputs.version }} --build-number=${{ github.run_number }} --dart-define=BUILD_NUMBER=${{ github.run_number }} --dart-define=APP_VERSION=${{ needs.test.outputs.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: Storilex-Linux
          path: build/linux/x64/release/bundle

  ios:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, flutter-version: 3.50.0 }
      - run: flutter build ios --config-only --release --no-codesign
      - name: Raise CocoaPods platform (ML Kit, llama.cpp need iOS 16.4)
        run: |
          if [ -f ios/Podfile ]; then
            sed -i '' "s/^# *platform :ios.*/platform :ios, '16.4'/; s/^platform :ios.*/platform :ios, '16.4'/" ios/Podfile
            grep -q "^platform :ios" ios/Podfile || sed -i '' "1s/^/platform :ios, '16.4'\n/" ios/Podfile
          fi
      - run: flutter build ios --release --no-codesign --build-name=${{ needs.test.outputs.version }} --build-number=${{ github.run_number }} --dart-define=BUILD_NUMBER=${{ github.run_number }} --dart-define=APP_VERSION=${{ needs.test.outputs.version }}
      - name: Package unsigned IPA (sign with Sideloadly / AltStore)
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          # ML Kit is linked into the app itself, so it looks for its resource
          # bundles (the translation model list, MLKitTranslate_resource) in
          # the app folder, not inside its framework: without them the
          # translation download closes the app.
          for b in Payload/Runner.app/Frameworks/*.framework/*.bundle; do
            [ -d "$b" ] && cp -R "$b" Payload/Runner.app/ && echo "copied $(basename "$b")"
          done
          test -d Payload/Runner.app/MLKitTranslate_resource.bundle
          zip -qr Storilex-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Storilex-iOS
          path: Storilex-unsigned.ipa

  macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, flutter-version: 3.50.0 }
      - run: flutter build macos --release --build-name=${{ needs.test.outputs.version }} --build-number=${{ github.run_number }} --dart-define=BUILD_NUMBER=${{ github.run_number }} --dart-define=APP_VERSION=${{ needs.test.outputs.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: Storilex-macOS
          path: build/macos/Build/Products/Release/Storilex.app

  # Dry run of the release: the same packaging and checks release.yml uses,
  # on every pull request and push, without creating, deleting, uploading or
  # editing any release. The token here is read-only.
  package:
    needs: [test, voice, windows, linux, android, ios, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, path: src }
      - name: Only release.yml can change the 'latest' release
        run: |
          python3 -I src/tools/release/test_release_check.py
          python3 -I src/tools/release/release_check.py check-workflows src/.github/workflows
      - uses: actions/download-artifact@v4
        with: { path: dist }
      - name: Release text (read only)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          src/tools/release/make_body.sh src "$(git -C src rev-parse HEAD)" "${{ needs.test.outputs.version }}" "${{ github.run_number }}" body.md
          python3 -I src/tools/release/release_check.py check-body body.md "${{ github.run_number }}" "${{ needs.test.outputs.version }}"
          cat body.md
      - name: Package files
        run: src/tools/release/package.sh dist
      - name: Check the release files
        run: |
          python3 -I src/tools/release/release_check.py verify-dist dist | tee SHA256SUMS
          ls -l dist/*.zip dist/*.apk dist/*.ipa dist/*.tar.gz
          {
            echo "### Release dry run (nothing published)"
            echo "Version ${{ needs.test.outputs.version }}, build ${{ github.run_number }}. Publish with release.yml (docs/RELEASING.md)."
            echo '```'; cat SHA256SUMS; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: release-preview
          path: |
            body.md
            SHA256SUMS
