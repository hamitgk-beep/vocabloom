name: build
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, flutter-version: 3.50.0 }
      - run: flutter pub get
      - run: flutter test

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, flutter-version: 3.50.0 }
      - name: Check Windows OCR
        run: flutter test test/ocr_platform_test.dart
      - run: flutter build windows --release --build-number=${{ github.run_number }} --dart-define=BUILD_NUMBER=${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: VocaBloom-Windows
          path: build/windows/x64/runner/Release

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, flutter-version: 3.50.0 }
      - name: Release signing key
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/vocabloom.jks"
            echo "VOCABLOOM_KEYSTORE=$RUNNER_TEMP/vocabloom.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_B64 secret is not set; the APK is signed with a temporary debug key."
          fi
      - run: flutter build apk --release --build-number=${{ github.run_number }} --dart-define=BUILD_NUMBER=${{ github.run_number }}
        env:
          VOCABLOOM_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: VocaBloom-Android
          path: build/app/outputs/flutter-apk/app-release.apk

  ios:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, flutter-version: 3.50.0 }
      - run: flutter build ios --config-only --release --no-codesign
      - name: Raise CocoaPods platform for ML Kit
        run: |
          if [ -f ios/Podfile ]; then
            sed -i '' "s/^# *platform :ios.*/platform :ios, '15.5'/; s/^platform :ios.*/platform :ios, '15.5'/" ios/Podfile
            grep -q "^platform :ios" ios/Podfile || sed -i '' "1s/^/platform :ios, '15.5'\n/" ios/Podfile
          fi
      - run: flutter build ios --release --no-codesign --build-number=${{ github.run_number }} --dart-define=BUILD_NUMBER=${{ github.run_number }}
      - name: Package unsigned IPA (sign with Sideloadly / AltStore)
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr VocaBloom-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: VocaBloom-iOS
          path: VocaBloom-unsigned.ipa

  macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, flutter-version: 3.50.0 }
      - run: flutter build macos --release --build-number=${{ github.run_number }} --dart-define=BUILD_NUMBER=${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: VocaBloom-macOS
          path: build/macos/Build/Products/Release/VocaBloom.app

  release:
    needs: [windows, android, ios, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist }
      - name: Package files
        run: |
          cd dist
          (cd VocaBloom-Windows && zip -qr ../VocaBloom-Windows.zip .)
          cp VocaBloom-Android/app-release.apk VocaBloom-Android.apk
          cp VocaBloom-iOS/VocaBloom-unsigned.ipa VocaBloom-iOS-unsigned.ipa
          (cd VocaBloom-macOS && zip -qry ../VocaBloom-macOS.zip .)
      - name: Publish 'latest' release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest --prerelease --target "$GITHUB_SHA" \
            --title "VocaBloom (son derleme)" \
            --notes "Build: ${{ github.run_number }}. Windows: zip'i aç, VocaBloom.exe'yi çalıştır. Android: APK'yı kur. iOS: imzasız IPA, Sideloadly/AltStore ile yükle." \
            dist/VocaBloom-Windows.zip dist/VocaBloom-Android.apk dist/VocaBloom-iOS-unsigned.ipa dist/VocaBloom-macOS.zip
