name: tutor-data
# Writes teacher answers for the AI tutor's training set with the Gemini free
# tier (secret GEMINI_TEACHER_KEY), a little every day so the free daily limit
# is never exceeded. Answers are collected on the "tutor-data" branch and the
# run resumes where the last one stopped.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      explain:
        description: 'Sentence explanations per run'
        default: '200'
      chat:
        description: 'Practice conversations per run'
        default: '40'
      grade:
        description: 'Grammar practice exercises per run (4 answers each)'
        default: '40'
      lessons:
        description: 'Grammar topics to write new practice sentences for (6 each, checked); 0 = off'
        default: '0'

permissions:
  contents: write

concurrency: tutor-data

jobs:
  teacher:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Key present?
        env: { KEY: '${{ secrets.GEMINI_TEACHER_KEY }}' }
        run: '[ -n "$KEY" ] || { echo "::error::Add the GEMINI_TEACHER_KEY secret first."; exit 1; }'
      - name: Answers collected so far
        run: |
          if git fetch -q origin tutor-data; then
            for f in teacher.jsonl teacher_chat.jsonl teacher_grade.jsonl; do
              git show "origin/tutor-data:tools/tutor/data/$f" > "tools/tutor/data/$f" 2>/dev/null || rm -f "tools/tutor/data/$f"
            done
            git show origin/tutor-data:tools/grammar/generated.jsonl > tools/grammar/generated.jsonl 2>/dev/null || rm -f tools/grammar/generated.jsonl
          fi
          wc -l tools/tutor/data/teacher*.jsonl 2>/dev/null || echo "none yet"
      - uses: subosito/flutter-action@v2
        with: { channel: stable, flutter-version: 3.50.0 }
      - run: flutter pub get
      - name: Prompts exactly as the app builds them
        run: |
          python3 tools/tutor/build_sft.py sentences 3000
          python3 tools/tutor/errors.py
          flutter test tools/tutor/export_prompts_test.dart
      - name: Teacher answers
        env:
          TEACHER_URL: https://generativelanguage.googleapis.com/v1beta/openai
          TEACHER_MODEL: auto
          # Free-tier limits are per model and per day; when one model's day is
          # used up the script moves on to the next.
          TEACHER_MODELS: gemini-3-flash-preview,gemini-3.5-flash-lite,gemini-flash-lite-latest,gemini-flash-latest
          TEACHER_KEY: ${{ secrets.GEMINI_TEACHER_KEY }}
          TEACHER_DELAY: '7'
          PYTHONUNBUFFERED: '1'
        # Each part has its own time limit and a stopped API ends the part at
        # once, so the answers written so far are always saved below.
        run: |
          run() { timeout "$1" python3 tools/tutor/teacher.py "${@:2}"; rc=$?; echo "teacher $2 exit $rc"; [ $rc -eq 3 ] && exit 0; return 0; }
          (
            run 100m explain ${{ github.event.inputs.explain || '200' }}
            run 40m chat ${{ github.event.inputs.chat || '40' }}
            run 60m grade ${{ github.event.inputs.grade || '40' }}
            if [ "${{ github.event.inputs.lessons || '0' }}" != "0" ]; then
              run 60m lessons 6 ${{ github.event.inputs.lessons || '0' }}
            fi
          ) || true
          wc -l tools/tutor/data/teacher*.jsonl 2>/dev/null || true
      - name: Save on the tutor-data branch
        if: always()
        run: |
          python3 tools/tutor/build_sft.py build || true
          touch tools/tutor/data/teacher.jsonl
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/keep && cp tools/tutor/data/teacher*.jsonl tools/tutor/data/train.jsonl tools/tutor/data/eval.jsonl /tmp/keep/
          [ -f tools/grammar/generated.jsonl ] && cp tools/grammar/generated.jsonl /tmp/keep-generated.jsonl || true
          if git rev-parse -q --verify origin/tutor-data >/dev/null; then
            git checkout -q -f -B tutor-data origin/tutor-data
          else
            git checkout -q -f -B tutor-data
          fi
          cp /tmp/keep/* tools/tutor/data/
          [ -f /tmp/keep-generated.jsonl ] && cp /tmp/keep-generated.jsonl tools/grammar/generated.jsonl && git add -f tools/grammar/generated.jsonl || true
          git add -f tools/tutor/data/teacher*.jsonl tools/tutor/data/train.jsonl tools/tutor/data/eval.jsonl
          git commit -qm "Tutor training data: $(wc -l < tools/tutor/data/teacher.jsonl) explanations, $(cat tools/tutor/data/teacher_chat.jsonl 2>/dev/null | wc -l) conversations" || echo "nothing new"
          git push -q origin tutor-data
