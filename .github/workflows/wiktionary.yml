name: wiktionary-data
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Replace the data-wiktionary release (no = only keep the file as a run artifact to check)"
        default: "yes"

jobs:
  extract:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download Wiktextract English dump and extract expressions
        run: |
          set -o pipefail
          # English entries of the Turkish Wiktionary give Turkish meanings of
          # expressions the English edition has no Turkish translation for.
          curl -sSfL -o tr-wiktionary.jsonl.gz https://kaikki.org/trwiktionary/raw-wiktextract-data.jsonl.gz \
            || { echo "Turkish Wiktionary dump not found, skipped"; rm -f tr-wiktionary.jsonl.gz; }
          TR=""; [ -s tr-wiktionary.jsonl.gz ] && TR=tr-wiktionary.jsonl.gz
          curl -sSfL https://kaikki.org/dictionary/English/kaikki.org-dictionary-English.jsonl \
            | python3 tools/wiktionary_extract.py wiktionary_phrases.json.gz $TR
          ls -la wiktionary_phrases.json.gz
      - uses: actions/upload-artifact@v4
        with:
          name: wiktionary_phrases
          path: wiktionary_phrases.json.gz
      - name: Publish as release asset
        if: inputs.publish != 'no'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete data-wiktionary --yes --cleanup-tag || true
          gh release create data-wiktionary --prerelease --target "$GITHUB_SHA" \
            --title "Wiktionary data (build input)" \
            --notes "English expressions extracted from the English and Turkish Wiktionary via kaikki.org (CC BY-SA 4.0). Used by tools/build_dict.py." \
            wiktionary_phrases.json.gz
