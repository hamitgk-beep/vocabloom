name: voice-models
# Publishes the offline voice packs the app downloads once (Settings > Read aloud)
# to the "voice-models" release. Runs when the pack recipe changes, or by hand.
on:
  push:
    paths:
      - tools/build_voice_packs.sh
      - tools/ema_export.py
      - .github/workflows/voice-models.yml
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Tools to export the Turkish EMA voice to ONNX
        run: pip install --extra-index-url https://download.pytorch.org/whl/cpu torch ema-lightning onnx onnxruntime huggingface_hub
      - run: tools/build_voice_packs.sh dist
      - name: Publish 'voice-models' release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view voice-models >/dev/null 2>&1; then
            gh release create voice-models --prerelease --target "$GITHUB_SHA" \
              --title "Storilex ses paketleri" \
              --notes "Uygulamanın bir kez indirdiği çevrimdışı ses paketleri. İngilizce: Kokoro-82M v1.0 (Apache 2.0). Türkçe: EMA Lightning (Apache 2.0) ve Piper Fahrettin (CC0 kayıtlar). sherpa-onnx (Apache 2.0) ve eSpeak NG (GPL-3.0) ile çalışır."
          fi
          gh release upload voice-models dist/*.zip --clobber
